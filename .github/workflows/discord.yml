name: Discord Notify

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: POST
          contentType: 'application/json'
          data: |
            {
              "content": "<@1486792059389083678>",
              "username": "Challenges",
              "avatar_url": "https://smp-modcraft.de/challenges.png",
              "embeds": [
                {
                  "title": "Challenges Updates",
                  "description": "**New update available!**\n\n**Changelog:**\n${{ github.event.head_commit.message }}",
                  "color": 5763719,
                  "footer": {
                    "text": "Challenges • https://smp-modcraft.de/plugins/challenge"
                  },
                  "timestamp": "${{ github.event.head_commit.timestamp || github.event.created_at }}"
                }
              ],
              "components": [
                {
                  "type": 1,
                  "components": [
                    {
                      "type": 2,
                      "style": 5,
                      "label": "📦 Download ↗",
                      "url": "https://modrinth.com/plugin/challenges-plugin"
                    }
                  ]
                }
              ]
            }