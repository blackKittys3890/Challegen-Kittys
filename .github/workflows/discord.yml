name: Discord Notify

on:
  push:
    branches:
      - master

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Read version
        run: |
          if [ -f version.txt ]; then
            echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
          else
            echo "VERSION=unknown" >> $GITHUB_ENV
          fi

      - name: Set commit message
        run: |
          echo "MESSAGE=${{ github.event.head_commit.message || 'No commit message' }}" >> $GITHUB_ENV

      - name: Send Discord Webhook
        run: |
          JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg msg "$MESSAGE" \
            --arg role "<@&1486792059389083678>" \
            '{
              content: $role,
              username: "Challenge Plugin",
              avatar_url: "https://smp-modcraft.de/challenges.png",
              embeds: [
                {
                  title: "Challenges Update",
                  description: ("**New update available!**\n\nVersion: **" + $version + "**\n\n**Changelog:**\n" + $msg),
                  color: 5763719,
                  footer: {
                    text: "Challenges • https://smp-modcraft.de/plugins/challenge"
                  }
                }
              ]
            }')
          
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "$JSON" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}